<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Force Fitness Gym</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
      integrity="sha512-HK5fgLBL+xu6dm/Ii3z4xhlSUyZgTT9tuc/hSrtw6uzJOvgRr2a9jyxxT1ely+B+xFAmJKVSTbpM/CuL7qxO8w=="
      crossorigin="anonymous"
    />
  </head>
  <body>
    <main>
      <div class="container">
        <nav>
          <h3>Who Am I</h3>
          <ul>
            <li>Home</li>
            <li>Services</li>
            <li>Plans</li>
            <li>Trainers</li>
            <li>Contact Us</li>
          </ul>
        </nav>
      </div>
      <div class="landing">
        <img src="images/gym-3.jpg" alt="" />
      </div>
    </main>

    <div class="container">
      <div class="box1">
        <div class="box1p1">
          <h4>Features</h4>
          <h2>What we offer</h2>
          <div>
            <ul>
              <li>Group Fitness Classes</li>
              <li>Personal Trainer Sessions</li>
              <li>Indoor Pool</li>
              <li>Steam Room and Sauna</li>
              <li>Basqutball Court</li>
              <li>Open 24/7</li>
            </ul>
          </div>
        </div>
        <div class="box1p2">
          <img src="images/gym-1.jpg" alt="" />
        </div>
      </div>
    </div>
    <div class="box"></div>
    <div class="box"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/ScrollTrigger.min.js"></script>
    <script>
      let tl = gsap.timeline({
        // yes, we can add it to an entire timeline!
        scrollTrigger: {
          trigger: ".box1",
          //  pin: true, // pin the trigger element while active
          start: "top 70%", // when the top of the trigger hits the top of the viewport
          end: "+=300", // end after scrolling 500px beyond the start
          scrub: 1, // smooth scrubbing, takes 1 second to "catch up" to the scrollbar
          markers: true,
          snap: {
            snapTo: "labels", // snap to the closest label in the timeline
            duration: { min: 0.2, max: 3 }, // the snap animation should be at least 0.2 seconds, but no more than 3 seconds (determined by velocity)
            delay: 0.2, // wait 0.2 seconds from the last scroll event before doing the snapping
            ease: "power1.inOut", // the ease of the snap animation ("power3" by default)
          },
        },
      });
      tl.addLabel("start")
        .from(".box1p1", { x: 500, scale: 0.3, rotation: 45, autoAlpha: 0 })
        .from(".box1p2", { x: -500, scale: 0.3, rotation: 45, autoAlpha: 0 })
        .from(".box1p1 h4", { x: -100, opacity: 0 }, ".3")
        .from(".box1p1 h2", { x: -100, opacity: 0 })
        .from(".box1p1 ul li", { x: -100, opacity: 0, stagger: 1 });
    </script>
  </body>
</html>
